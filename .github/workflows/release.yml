name: Build Windows Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate tag and application version
        shell: pwsh
        run: |
          $source = Get-Content -LiteralPath "backend/app_version.py" -Raw
          $match = [regex]::Match($source, 'APP_VERSION\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "APP_VERSION not found" }
          $expectedTag = "v$($match.Groups[1].Value)"
          if ($expectedTag -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match $expectedTag"
          }

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run tests
        run: |
          python -m unittest backend.test_music_source_fallbacks backend.test_build_runtime_data backend.test_update_service
          npm run lint --prefix frontend

      - name: Build portable Windows application
        run: python build.py --clean

      - name: Create release assets
        shell: pwsh
        run: |
          $asset = "music-player-windows-x64.zip"
          Compress-Archive -Path "dist/music-server/*" -DestinationPath $asset -CompressionLevel Optimal -Force
          $hash = (Get-FileHash -LiteralPath $asset -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset" | Set-Content -LiteralPath "$asset.sha256" -Encoding ascii

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "music-player-windows-x64.zip" `
            "music-player-windows-x64.zip.sha256" `
            --verify-tag `
            --generate-notes `
            --title "Music Player ${{ github.ref_name }}"

